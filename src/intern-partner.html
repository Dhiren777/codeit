<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best IT Training Center</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .container {
            width: 86%;
            margin: auto;
        }
    </style>
</head>

<body class="bg-blue-100">

    <section class="min-h-[518px] md:mb-10 mb-4 bg-cover bg-no-repeat"
        style="background-image: url('assets/images/Partnership.avif');">

        <div class="container py-5">
            <p class="font-inter font-medium text-[14px] text-white md:text-left">
                Home > <span>Intern Partners</span>
            </p>

            <div class="md:flex justify-between items-center gap-4">
                <div class="flex justify-center md:order-1 md:py-20 py-10">
                    <img src="assets/images/iternship-image.avif" alt="Gallery Image"
                        class="w-[300px] md:w-[447px] h-auto md:h-[329px] shadow-lg ">

                </div>
                <div class="text-white">
                    <div class="w-full md:w-[563px] md:text-left">
                        <p class="font-inter font-medium text-[32px] ">
                            Intern Partners
                        </p>
                        <p class="font-inter font-medium text-sm md:text-base">
                            Code IT connects you with different companies that provide internship opportunities,
                            helping you gain real-world experience, develop more skills, and take the next step toward
                            your dream career.
                        </p>
                    </div>


                </div>

            </div>
        </div>
    </section>


    <div class="container space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 justify-center">
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/kite.avif" alt="" />
            </div>
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/diana.avif" alt="" />
            </div>
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/codeit.avif" alt="" />
            </div>
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/reev.avif" alt="" />
            </div>
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/trion.avif" alt="" />
            </div>
            <div class="relative group">
                <img class="w-full max-w-[387px] h-auto hover:shadow-2xl rounded-xl transition-all duration-300"
                    src="assets/images/alvics.avif" alt="" />
            </div>
        </div>
    </div>

</body>

</html>
