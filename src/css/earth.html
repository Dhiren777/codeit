<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Orbit Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Keyframe Animation for Orbit Movement */
        @keyframes orbit {
            from {
                transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg);
            }
            to {
                transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg);
            }
        }

        .orbit-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        /* Dynamic Orbit Circles */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px dotted rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
        }

        /* Icon Movement */
        .orbit-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            animation: orbit 10s linear infinite;
        }

        .orbit-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 13 Orbits with Varying Sizes */
        .orbit:nth-child(1) { width: 100px; height: 100px; }
        .orbit:nth-child(2) { width: 140px; height: 140px; }
        .orbit:nth-child(3) { width: 180px; height: 180px; }
        .orbit:nth-child(4) { width: 220px; height: 220px; }
        .orbit:nth-child(5) { width: 260px; height: 260px; }
        .orbit:nth-child(6) { width: 300px; height: 300px; }
        .orbit:nth-child(7) { width: 340px; height: 340px; }
        .orbit:nth-child(8) { width: 380px; height: 380px; }
        .orbit:nth-child(9) { width: 420px; height: 420px; }
        .orbit:nth-child(10) { width: 460px; height: 460px; }
        .orbit:nth-child(11) { width: 500px; height: 500px; }
        .orbit:nth-child(12) { width: 540px; height: 540px; }
        .orbit:nth-child(13) { width: 580px; height: 580px; }

        /* Assigning Orbit Radius & Animation Delays */
        .orbit-icon:nth-child(1) { --orbit-radius: 50px; animation-delay: 0s; }
        .orbit-icon:nth-child(2) { --orbit-radius: 70px; animation-delay: 0.5s; }
        .orbit-icon:nth-child(3) { --orbit-radius: 90px; animation-delay: 1s; }
        .orbit-icon:nth-child(4) { --orbit-radius: 110px; animation-delay: 1.5s; }
        .orbit-icon:nth-child(5) { --orbit-radius: 130px; animation-delay: 2s; }
        .orbit-icon:nth-child(6) { --orbit-radius: 150px; animation-delay: 2.5s; }
        .orbit-icon:nth-child(7) { --orbit-radius: 170px; animation-delay: 3s; }
        .orbit-icon:nth-child(8) { --orbit-radius: 190px; animation-delay: 3.5s; }
        .orbit-icon:nth-child(9) { --orbit-radius: 210px; animation-delay: 4s; }
        .orbit-icon:nth-child(10) { --orbit-radius: 230px; animation-delay: 4.5s; }
        .orbit-icon:nth-child(11) { --orbit-radius: 250px; animation-delay: 5s; }
        .orbit-icon:nth-child(12) { --orbit-radius: 270px; animation-delay: 5.5s; }
        .orbit-icon:nth-child(13) { --orbit-radius: 290px; animation-delay: 6s; }

    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-black">

    <div class="orbit-container">
        <!-- Centered Icon -->
       

        <!-- 13 Orbit Rings -->
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>

        <!-- Icons in Orbits -->
        
    </div>

</body>
</html>
