<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order-Page</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="w-[375px] h-[929.38px] p-[20px] border bg-gray-100">
        <div class="flex justify-center">
            <img src="assets/images/dal curry.png" alt="">
        </div>
        <div>
            <div class="my-5">
                <p>Daal Curry Set</p>
                <div class="flex gap-3">
                    <p class="font-extrabold text-2xl text-[#610512]">&yen; 650</p>
                    <p class="font-normal text-sm text-[#610512] mt-1">(tax included ¥ 702)</p>
                </div>
            </div>
            <hr>

            <div class="my-5">
                <p>Choose Your Spiciness:</p>
                <div class="flex space-x-[20px]">
                    <img src="assets/images/zero.png" alt="">
                    <img src="assets/images/mild.png" alt="">
                    <img src="assets/images/spisy.png" alt="">
                    <img src="assets/images/hot.png" alt="">
                    <img src="assets/images/extra.png" alt="">

                </div>
            </div>
            <hr>

            <div class="flex gap-[15px] my-5">
                <p>Quantity:</p>
                <div class="flex gap-[5px]">
                    <img src="assets/images/subtract-line.png" alt="">
                    <p>1</p>
                    <img src="assets/images/add-fill.png" alt="">
                </div>
            </div>
            <hr>

            <div class="my-5">
                <p>Please let us know any other requests you may have.</p>
                <p class="border bg-white w-[335px] h-[91px] p-[16px]">(Example) Please make spiciness to the next level.</p>
            </div>
            <hr>

            <div class="flex  justify-between my-5">
                <p>Order Amount:</p>
                <div class="flex gap-3">
                    <p class="font-extrabold text-2xl text-[#610512]">&yen; 650</p>
                    <p class="font-normal text-sm text-[#610512] mt-1">(tax included ¥ 702)</p>
                </div>
            </div>
            <br>
            <div class="my-5 flex justify-between">
                <button class="w-[184px] h-[38px] rounded-full px-[16px] py-[8px] bg-white text-[open sans] text-[700] text-center">Continue Shopping</button>
                <button class="w-[184px] h-[38px] rounded-full px-[16px] py-[8px] bg-white text-[open sans] text-[700] text-center">Go To Cart</button>

            </div>


        </div>


    </div>

</body>

</html>
